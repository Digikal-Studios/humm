[workspace]
resolver = "3"
members = [
    "crates/humm-core",
    "crates/humm-media",
    "crates/humm-whisper",
    "crates/humm-audio",
    "crates/humm-store",
    "crates/humm-dfn",
    "crates/humm-diarize",
    "crates/humm-cli",
    "crates/humm-gui",
]
# The ADR-002 validation benchmark lives under validation/; it is a protocol +
# scripts, not a cargo project, and must never be pulled into the workspace.
exclude = ["validation/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://repo.digikal.com/jawad/humm"

[workspace.dependencies]
humm-core = { path = "crates/humm-core", version = "0.1.0" }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart"] }
sha2 = "0.10"
csv = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
log = { version = "0.4", features = ["std"] }
whisper-rs = "0.16"
cpal = "0.18"
rubato = "4"
rtrb = "0.3"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tempfile = "3"
insta = "1"
pretty_assertions = "1"
criterion = "0.8.2"
assert_cmd = "2"
predicates = "3"
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
flume = "0.11"
toml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
fd-lock = "4"
egui = "0.35"
eframe = { version = "0.35", features = ["persistence"] }
egui_extras = { version = "0.35", features = ["serde"] }
rfd = "0.17"
fluent = "0.17"
unic-langid = { version = "0.9", features = ["macros"] }
open = "5"
regex = "1"
egui_kittest = { version = "0.35", features = ["eframe"] }
notify = "8"
ab_glyph = "0.2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
# F-087 (M8): sample-selection randomness for the Speaker-ID window's Play
# sample button (`humm-gui`'s `speaker_id` module) — picks a random candidate
# segment for the chosen speaker (Buzz `random.choice`,
# `speaker_identification_widget.py:714`). Pinned to `0.8` (not `0.9`/`0.10`):
# `speakrs`'s own dependency chain (`cauchy` -> `ndarray-linalg`) already
# resolves `rand 0.8.7` into the workspace lockfile, so this adds no new
# major version to the dependency graph.
rand = "0.8"
# F-112 (M8): pure-Rust DeepFilterNet3 noise reduction. Git-pinned per
# `validation/m8-spikes/README.md` Spike A / ADR-011 addendum — the
# crates.io release is stale (DeepFilterNet1-era 0.2.5); this rev is tag
# `v0.5.6`. `default-features = false` + `["tract", "default-model"]`: pure
# tract (ONNX-in-Rust) inference, no `ort`, embeds the DeepFilterNet3 model
# via `include_bytes!` — no model download at runtime.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = [
    "tract",
    "default-model",
] }
# Pinned to match `deep_filter`'s own `^0.15` requirement on `ndarray`
# (`libDF/Cargo.toml`) — `humm-dfn` builds the `ArrayView2`/`ArrayViewMut2`
# frames `DfTract::process` takes directly, so this must resolve to the same
# `ndarray` `deep_filter` itself uses.
ndarray = "0.15"
# F-087 (M8): speaker diarization (segmentation ONNX + embedding ONNX + VBx
# clustering), picked over pyannote-rs in `validation/m8-spikes/README.md`
# Spike B / ADR-024 — pyannote-rs 0.3.4 fails to build against this ADR's
# exact `ort =2.0.0-rc.12` pin (an upstream `Send + Sync` regression breaks
# its `eyre`-based error conversion), while speakrs builds cleanly against
# it. Exact-pinned per ADR-024/Standing Policy rule 5 ("one crate, exact
# pin"). `default-features = false` drops the crate's default
# `ndarray-linalg`/`openblas-static` (from-source OpenBLAS; fails to link
# on this machine's Homebrew toolchain, Spike B criterion 1);
# `openblas-system` links Homebrew's prebuilt OpenBLAS instead (macOS build
# prerequisite: `brew install openblas libomp`). `coreml` is additive — CPU
# mode still works with it enabled; ort's own prebuilt runtime binary fetch
# at build time (`cdn.pyke.io`) needs a sandbox-lifted first build/fetch.
# Task 9 review: the spike's own recorded feature set (`online` included)
# was never a deliberate choice — `online` gates `hf-hub`/`ModelManager`'s
# HuggingFace-download path, which `humm-diarize` never calls (it only uses
# `from_dir`, ungated). Dropping `online` removed 20 dependencies
# (`hf-hub`, `cookie`/`cookie_store`, `hyper-tls`, `tokio-native-tls`, etc.)
# and confirmed no `native-tls` feature ever reaches the workspace's shared
# `reqwest` (still purely `rustls`-based) — see ADR-024's Task 9 addendum.
speakrs = { version = "=0.5.0", default-features = false, features = [
    "openblas-system",
    "coreml",
] }
# `ort` itself only ever reaches the graph transitively through `speakrs`'s
# own `version = "2.0.0-rc.12"` requirement (a caret req, not an exact pin —
# Cargo treats a bare pre-release version string this way), so ADR-024's
# "exact `ort =2.0.0-rc.12` pin" claim had nothing enforcing it. Declared
# directly here (default features — the same set `speakrs` already resolves
# it to: `std`, `ndarray`, `tracing`, `download-binaries`, `tls-native`,
# `copy-dylibs`, `api-24`) so the exact pin is real, in `humm-diarize` (the
# one crate naming `ort`/`speakrs`, Standing Policy rule 5).
ort = "=2.0.0-rc.12"

[profile.release]
lto = "thin"
codegen-units = 1

# whisper-rs-sys 0.15.0 loads CoreML from whisper_init_state even when
# use_gpu is false. This path crate gates that probe (ADR-002 addendum).
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
