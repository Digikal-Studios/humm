name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI selects stable without changing a shared macOS user's Rust default.
  RUSTUP_TOOLCHAIN: stable
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  gates:
    # GitHub-hosted macOS ARM. The org apple-ci / digikal-apple self-hosted
    # runner is not registered for this repository, so gates queued forever.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check host dependencies and provision verified Buzz fixtures
        run: python3 scripts/ci_prepare.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Ordinary CLI/GUI tests use ffmpeg/ffprobe and the verified Buzz stub/WAV.
      # Existing #[ignore] contract/acceptance tests additionally need real models,
      # yt-dlp, or explicitly configured services; their coverage is unchanged.
      - name: Test
        run: cargo test --workspace
