name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI selects stable without changing a shared macOS user's Rust default.
  RUSTUP_TOOLCHAIN: stable
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  gates:
    # GitHub-hosted macOS ARM. The org apple-ci / digikal-apple self-hosted
    # runner is not registered for this repository, so gates queued forever.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check host dependencies and provision verified Buzz fixtures
        run: python3 scripts/ci_prepare.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Ordinary CLI/GUI tests use ffmpeg/ffprobe and the verified Buzz stub/WAV.
      # Existing #[ignore] contract/acceptance tests additionally need real models,
      # yt-dlp, or explicitly configured services; their coverage is unchanged.
      - name: Test
        run: cargo test --workspace

  # The four native hosts outside `gates`. macOS ARM is `gates` on
  # GitHub-hosted macos-14, which installs Homebrew OpenBLAS, libomp, cmake,
  # and ffmpeg. This matrix has no macOS cell: a cell here would skip those
  # formulae and duplicate `gates` with a weaker toolchain.
  #
  # Labels are the standard hosted runners documented at
  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
  # (ubuntu-24.04-arm and windows-11-arm included; none of the requested
  # targets were skipped).
  #
  # Scope stays on humm-core, humm-media, and humm-audio. humm-diarize stays
  # unbuilt, so speakrs/coreml and ort are not required and no models are
  # downloaded. `cargo test` does not pass `--ignored`, so ffmpeg/yt-dlp
  # contract tests and model-download contracts stay skipped, and ffmpeg is
  # not installed. Clippy on these cells is what lints cfg(windows) and
  # cfg(target_os = "linux") items that macos-14 `gates` does not compile.
  #
  # A green Windows cell includes the live `cmd /C ver` check in humm-core.
  # It is not a live `taskkill` (the suite checks the argument vector) and
  # not a WASAPI capture or playback stream (those tests stay ignored, and
  # a missing host still passes the unit test). Linux still needs ALSA
  # headers: cpal's alsa-sys links libasound via pkg-config, and that
  # package is not on the runner image.
  hosted-libraries:
    name: libraries (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
          - os: ubuntu-latest
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: windows-11-arm
            name: Windows ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Clippy humm-core, humm-media, and humm-audio
        run: cargo clippy -p humm-core -p humm-media -p humm-audio --all-targets -- -D warnings

      - name: Test humm-core, humm-media, and humm-audio
        run: cargo test --locked -p humm-core -p humm-media -p humm-audio
