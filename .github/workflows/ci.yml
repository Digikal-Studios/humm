name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Contract tests (crates/*/tests, #[ignore]) require ffmpeg/ffprobe/yt-dlp
      # and local model files; they are not run in CI. Run them locally with
      # `cargo test -p humm-media -- --ignored`.
      - name: Test
        run: cargo test --workspace
