[package]
name = "humm-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
humm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
url.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
# SIGHUP delivery on a thread (not inside the signal handler) so terminal
# close can kill detached children without unsafe in this crate.
signal-hook = { version = "0.3.18", default-features = false, features = ["iterator"] }

[target.'cfg(windows)'.dependencies]
# Kill-on-close job so a console-less child dies when humm exits.
win32job = "2.0.3"

[dev-dependencies]
pretty_assertions.workspace = true
criterion.workspace = true

[[bench]]
name = "decode"
harness = false
