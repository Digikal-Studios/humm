[package]
name = "humm-diarize"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
humm-core.workspace = true
speakrs.workspace = true
# Direct dependency so ADR-024's exact `=2.0.0-rc.12` pin is real rather than
# only enforced transitively through `speakrs`'s own (caret) requirement —
# see the workspace `Cargo.toml`'s comment on this line.
ort.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
# Not `ndarray.workspace = true` (the workspace pin is `0.15`, for
# `humm-dfn`/`deep_filter`'s `ArrayView2` interop) — `speakrs` 0.5.0 itself
# depends on `ndarray 0.17.2` (its own `Cargo.toml`), and the D5b-10 test
# coverage below constructs an `Array2<f32>` to feed `speakrs::segment::
# to_segments` directly, so it must resolve to the same `ndarray` `speakrs`
# uses. Already present in `Cargo.lock` via `speakrs`'s own dependency; this
# adds no new major version to the workspace's dependency graph.
ndarray = "0.17"
